name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The design-system rules are regression tests. A deploy that would
      # break one does not ship.
      - name: Regression tests
        run: npm test

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Account IDs are not secret, and this is the same account the
          # JDM Connect Worker deploys into.
          CLOUDFLARE_ACCOUNT_ID: 78a4648f57e3da163587fff349bf8b19
