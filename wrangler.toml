name = "yourjdmparts"
main = "src/worker.js"
compatibility_date = "2026-08-01"

# The production hostnames, attached as custom domains on every deploy.
# Custom domains rather than routes: Cloudflare creates the DNS records and
# the certificate itself, so going live needs no dashboard step. In a
# non-interactive deploy wrangler also replaces any conflicting DNS record
# on these names — load-bearing, because www carried a dead record that
# answered 522 until a deploy overrode it.
routes = [
  { pattern = "yourjdmparts.com", custom_domain = true },
  { pattern = "www.yourjdmparts.com", custom_domain = true }
]

# Declaring routes switches the workers.dev preview host off by default.
# Keep it: docs/SETUP.md points at it, QA runs against it, and it already
# answers every request with a noindex header.
workers_dev = true

# Static assets (stylesheets, fonts, the pattern, the logo) are served
# straight from ./public by Cloudflare's asset server, which answers before
# the Worker is invoked. The ASSETS binding is the fallback path for anything
# it does not match. Deliberately not `run_worker_first`: see guard() in
# src/worker.js for what that would buy and why it is not taken.
[assets]
directory = "./public"
binding = "ASSETS"

# Part requests are written here the moment they validate, so a submission
# is never dependent on a webhook being configured. Readable in the
# dashboard: D1 -> yourjdmparts-requests -> Console. Created in Oceania so
# the write is close to Perth.
[[d1_databases]]
binding = "REQUESTS_DB"
database_name = "yourjdmparts-requests"
database_id = "7d5f1625-ba67-40e5-8d36-627a2c2b2fab"

[observability]
enabled = true

# Secrets are set in the Cloudflare dashboard, never here:
#   REQUEST_WEBHOOK  where part requests are delivered
