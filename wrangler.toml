name = "yourjdmparts"
main = "src/worker.js"
compatibility_date = "2026-08-01"

# Static assets (stylesheets, fonts, the pattern, the logo) are served
# straight from ./public by Cloudflare's asset server, which answers before
# the Worker is invoked. The ASSETS binding is the fallback path for anything
# it does not match. Deliberately not `run_worker_first`: see guard() in
# src/worker.js for what that would buy and why it is not taken.
[assets]
directory = "./public"
binding = "ASSETS"

# Part requests are written here the moment they validate, so a submission
# is never dependent on a webhook being configured. Readable in the
# dashboard: D1 -> yourjdmparts-requests -> Console. Created in Oceania so
# the write is close to Perth.
[[d1_databases]]
binding = "REQUESTS_DB"
database_name = "yourjdmparts-requests"
database_id = "7d5f1625-ba67-40e5-8d36-627a2c2b2fab"

[observability]
enabled = true

# Secrets are set in the Cloudflare dashboard, never here:
#   REQUEST_WEBHOOK  where part requests are delivered
